# Test data for the Trivy checks (issue #4). Not a real Compose file.
# It obeys policy sections 7 and 8.2. It uses a YAML anchor and merge keys.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  deploy:
    resources:
      limits: { cpus: "0.50", memory: 256M }

services:
  proxy:
    <<: *hardening
    image: ghcr.io/batkomahno2008/radio-learning-proxy:main
    user: "101"
    ports: ["8080:8080"]
    tmpfs: [/tmp]
  app:
    <<: *hardening
    image: ghcr.io/batkomahno2008/radio-learning:main
    user: "10001:10001"
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?set it}@db:5432/app
  db:
    <<: *hardening
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: "70:70"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it}
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    tmpfs: [/tmp, /var/run/postgresql]
