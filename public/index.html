<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <span>Radio</span>
    <img src="/logo.png" alt="">
    <span>Learning</span>
  </header>

  <main>
    <section class="now-playing" aria-label="Now playing">
      <div class="container">
        <div class="art"><img id="cover" alt="" hidden></div>

        <div class="details">
          <h1 id="artist">Radio Learning</h1>
          <h2 id="title">Live stream</h2>
          <h3 id="album" hidden></h3>

          <p class="quality">
            <span id="source-quality" hidden></span>
            <span id="stream-quality">Stream quality: HLS</span>
          </p>
          <p id="state" role="status" hidden></p>

          <div id="rating" class="rating">
            <span id="rating-label">Rate this track:</span>
          </div>

          <div class="player" role="group" aria-label="Radio player">
            <button id="play" class="icon-btn" type="button" aria-label="Play" disabled>
              <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
              <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M9 5v14M15 5v14"/></svg>
            </button>
            <span id="status">Loading…</span>
            <button id="mute" class="icon-btn" type="button" aria-label="Mute">
              <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9v6h4l5 4V5L8 9z"/>
                <path id="icon-waves" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>
                <path id="icon-muted" d="M17 9.5l5 5M22 9.5l-5 5" hidden/>
              </svg>
            </button>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
          </div>

          <audio id="audio" preload="none"></audio>
        </div>
      </div>
    </section>

    <section class="previous" aria-labelledby="previous-heading">
      <div class="container">
        <div class="previous-inner">
          <h3 id="previous-heading">Previous tracks:</h3>
          <ol id="previous"></ol>
        </div>
      </div>
    </section>
  </main>

  <footer>Ad-free. Data-free. Subscription-free.</footer>

  <!-- Thumbs with their totals; cloned for the current track and each previous one. -->
  <template id="rating-template">
    <div class="rating-controls" role="group">
      <button class="icon-btn" type="button" data-value="1" aria-pressed="false" disabled>
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3zM7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg>
      </button>
      <span class="count"></span>
      <button class="icon-btn" type="button" data-value="-1" aria-pressed="false" disabled>
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 15v4a3 3 0 003 3l4-9V2H5.72a2 2 0 00-2 1.7l-1.38 9a2 2 0 002 2.3zM17 2h3a2 2 0 012 2v7a2 2 0 01-2 2h-3"/></svg>
      </button>
      <span class="count"></span>
    </div>
  </template>

  <script src="/vendor/hls/hls.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
