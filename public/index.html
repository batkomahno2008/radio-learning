<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Calico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap">
  <style>
    :root {
      --mint: #D8F2D5;
      --forest: #1F4E23;
      --teal: #38A29D;
      --orange: #EFA63C;
      --charcoal: #231F20;
      --cream: #F5EADA;
      --white: #FFFFFF;
      --heading-font: "Montserrat", "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--white);
      color: var(--charcoal);
      font: 400 1rem/1.6 "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1, h2, h3 { margin: 0; font-family: var(--heading-font); color: var(--forest); overflow-wrap: anywhere; }
    h1 { font-size: 3rem; font-weight: 700; line-height: 1.2; }
    h2 { font-size: 2.25rem; font-weight: 600; line-height: 1.3; }
    h3 { font-size: 1.5rem; font-weight: 500; line-height: 1.4; }
    [hidden] { display: none !important; }

    /* Logo is 48px with 24px (50% of its diameter) of clear space on every side. */
    header {
      background: var(--teal);
      color: var(--white);
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font: 700 2.25rem/1 var(--heading-font);
    }
    header img { width: 48px; height: 48px; border-radius: 50%; background: var(--mint); }

    .container { width: 100%; max-width: 992px; margin: 0 auto; padding: 0 16px; }

    main { flex: 1; display: flex; flex-direction: column; }
    .now-playing { padding: 64px 0; }
    .now-playing .container { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
    .art { grid-column: span 7; align-self: start; aspect-ratio: 1; background: var(--cream); }
    .art img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .details { grid-column: span 5; display: flex; flex-direction: column; min-width: 0; }
    .details h2 { margin-top: 48px; }
    .details h3 { margin-top: 32px; }
    .quality { margin: 32px 0 0; font-style: italic; }
    .quality span { display: block; }
    #state { margin: 16px 0 0; font-size: 0.875rem; line-height: 1.4; }
    #state.error { color: #A3271F; }

    .rating { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 32px; }
    .rating span { margin-right: 8px; }

    .icon-btn {
      flex: none;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--charcoal);
      cursor: pointer;
    }
    .icon-btn svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn:hover:not(:disabled) { background: var(--mint); }
    .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .icon-btn[aria-pressed=true] svg { fill: var(--orange); }
    button:focus-visible, input:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(56, 162, 157, 0.3);
    }

    .player {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 336px;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      background: var(--cream);
    }
    #status { flex: 1; min-width: 0; font-size: 0.875rem; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    input[type=range] {
      flex: none;
      width: 96px;
      height: 24px;
      margin: 0;
      background: transparent;
      border-radius: 4px;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--charcoal); }
    input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--charcoal); }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px; margin-top: -6px;
      border: 0; border-radius: 50%; background: var(--teal);
    }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--teal); }

    .previous { flex: 1; background: var(--mint); padding: 48px 0; }
    .previous-inner { width: fit-content; min-width: min(336px, 100%); margin: 0 auto; }
    .previous ol { margin: 8px 0 0; padding: 0; list-style: none; }
    .previous em { font-style: italic; }

    footer { background: var(--cream); color: var(--forest); padding: 16px 24px; text-align: center; font-size: 0.875rem; line-height: 1.4; }

    @media (max-width: 768px) {
      h1 { font-size: 2.25rem; }
      h2 { font-size: 1.5rem; }
      h3 { font-size: 1.25rem; }
      header { gap: 16px; font-size: 1.75rem; }
      .now-playing { padding: 32px 0; }
      .art, .details { grid-column: 1 / -1; }
      .details h2 { margin-top: 16px; }
      .details h3 { margin-top: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <span>Radio</span>
    <img src="/logo.png" alt="">
    <span>Calico</span>
  </header>

  <main>
    <section class="now-playing" aria-label="Now playing">
      <div class="container">
        <div class="art"><img id="cover" alt="" hidden></div>

        <div class="details">
          <h1 id="artist">Radio Calico</h1>
          <h2 id="title">Live stream</h2>
          <h3 id="album" hidden></h3>

          <p class="quality">
            <span id="source-quality" hidden></span>
            <span id="stream-quality">Stream quality: HLS</span>
          </p>
          <p id="state" role="status" hidden></p>

          <div class="rating">
            <span id="rating-label">Rate this track:</span>
            <button id="rate-up" class="icon-btn" type="button" aria-label="Thumbs up" aria-describedby="rating-label" aria-pressed="false" disabled>
              <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3zM7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg>
            </button>
            <button id="rate-down" class="icon-btn" type="button" aria-label="Thumbs down" aria-describedby="rating-label" aria-pressed="false" disabled>
              <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 15v4a3 3 0 003 3l4-9V2H5.72a2 2 0 00-2 1.7l-1.38 9a2 2 0 002 2.3zM17 2h3a2 2 0 012 2v7a2 2 0 01-2 2h-3"/></svg>
            </button>
          </div>

          <div class="player" role="group" aria-label="Radio player">
            <button id="play" class="icon-btn" type="button" aria-label="Play" disabled>
              <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
              <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M9 5v14M15 5v14"/></svg>
            </button>
            <span id="status">Loading…</span>
            <button id="mute" class="icon-btn" type="button" aria-label="Mute">
              <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9v6h4l5 4V5L8 9z"/>
                <path id="icon-waves" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>
                <path id="icon-muted" d="M17 9.5l5 5M22 9.5l-5 5" hidden/>
              </svg>
            </button>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
          </div>

          <audio id="audio" preload="none"></audio>
        </div>
      </div>
    </section>

    <section class="previous" aria-labelledby="previous-heading">
      <div class="container">
        <div class="previous-inner">
          <h3 id="previous-heading">Previous tracks:</h3>
          <ol id="previous"></ol>
        </div>
      </div>
    </section>
  </main>

  <footer>Ad-free. Data-free. Subscription-free.</footer>

  <script src="/vendor/hls/hls.min.js"></script>
  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const muteBtn = document.getElementById('mute');
    const volume = document.getElementById('volume');
    const statusEl = document.getElementById('status');
    const stateEl = document.getElementById('state');
    const streamQualityEl = document.getElementById('stream-quality');
    const coverEl = document.getElementById('cover');
    const rateBtns = { 1: document.getElementById('rate-up'), '-1': document.getElementById('rate-down') };

    const LOSSLESS = /flac|alac/i;
    const METADATA_INTERVAL_MS = 10000;
    let hls = null;
    let wantPlay = false;
    let metadataBase = null;
    let track = null;
    let myRating = 0;

    // Transient states show in the player; errors get their own line.
    function setState(text, isError = false) {
      statusEl.textContent = isError ? '' : text;
      stateEl.textContent = isError ? text : '';
      stateEl.classList.toggle('error', isError);
      stateEl.hidden = !isError;
    }

    function levelCodec(level) {
      return level.audioCodec || level.attrs?.CODECS || '';
    }

    function levelLabel(level) {
      const codec = levelCodec(level);
      const kbps = level.bitrate ? ` ${Math.round(level.bitrate / 1000)} kbps` : '';
      // The manifest's declared bandwidth understates the FLAC rendition, so omit it.
      if (LOSSLESS.test(codec)) return '48kHz FLAC / HLS Lossless';
      if (/mp4a/i.test(codec)) return `AAC${kbps} / HLS`;
      return `${codec || 'Default'}${kbps} / HLS`;
    }

    function showFormat() {
      const level = hls?.levels[hls.currentLevel];
      streamQualityEl.textContent = `Stream quality: ${level ? levelLabel(level) : 'HLS'}`;
    }

    function teardown() {
      if (hls) { hls.destroy(); hls = null; }
      audio.removeAttribute('src');
      audio.load();
      showFormat();
    }

    function loadStream(url) {
      teardown();
      if (!url) return;
      setState('Connecting…');

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ lowLatencyMode: false });
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          const levels = hls.levels;
          // Bitrate-based ABR would not reliably choose the lossless rendition,
          // so pin it explicitly whenever the stream offers one.
          const lossless = levels.findIndex((l) => LOSSLESS.test(levelCodec(l)));
          hls.currentLevel = lossless === -1 ? levels.length - 1 : lossless;
          showFormat();
          setState(wantPlay ? 'Buffering…' : 'Ready');
          if (wantPlay) play();
        });
        hls.on(Hls.Events.LEVEL_SWITCHED, showFormat);
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            setState('Network problem, retrying…', true);
            hls.startLoad();
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            setState('Playback problem, recovering…', true);
            hls.recoverMediaError();
          } else {
            setState('This stream cannot be played.', true);
            wantPlay = false;
            teardown();
          }
        });
        hls.loadSource(url);
        hls.attachMedia(audio);
      } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        // Native HLS (iOS Safari): the browser picks the rendition itself.
        audio.src = url;
        setState('Ready');
        if (wantPlay) play();
      } else {
        setState('This browser cannot play HLS streams.', true);
        playBtn.disabled = true;
      }
    }

    function play() {
      wantPlay = true;
      // Jump to the live edge instead of resuming stale buffered audio.
      if (hls?.liveSyncPosition) audio.currentTime = hls.liveSyncPosition;
      audio.play().catch((err) => {
        if (err.name === 'AbortError') return;
        wantPlay = false;
        setState(err.name === 'NotAllowedError' ? 'Press play to start.' : 'Could not start playback.', err.name !== 'NotAllowedError');
      });
    }

    function syncPlayIcon() {
      const playing = !audio.paused;
      // SVG elements have no `hidden` property, so toggle the attribute.
      document.getElementById('icon-play').toggleAttribute('hidden', playing);
      document.getElementById('icon-pause').toggleAttribute('hidden', !playing);
      playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    }

    function syncMuteIcon() {
      const silent = audio.muted || audio.volume === 0;
      document.getElementById('icon-waves').toggleAttribute('hidden', silent);
      document.getElementById('icon-muted').toggleAttribute('hidden', !silent);
      muteBtn.setAttribute('aria-label', audio.muted ? 'Unmute' : 'Mute');
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) play();
      else { wantPlay = false; audio.pause(); }
    });
    audio.addEventListener('play', syncPlayIcon);
    audio.addEventListener('pause', () => { syncPlayIcon(); if (!wantPlay) setState('Paused'); });
    audio.addEventListener('playing', () => { setState('Live'); showFormat(); });
    audio.addEventListener('waiting', () => { if (wantPlay) setState('Buffering…'); });

    muteBtn.addEventListener('click', () => { audio.muted = !audio.muted; });
    volume.addEventListener('input', () => { audio.volume = Number(volume.value); audio.muted = false; });
    audio.addEventListener('volumechange', syncMuteIcon);
    audio.volume = Number(volume.value);

    function setText(id, text) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.hidden = !text;
    }

    function clientId() {
      try {
        let id = localStorage.getItem('client');
        if (!id) { id = crypto.randomUUID(); localStorage.setItem('client', id); }
        return id;
      } catch {
        return null;
      }
    }

    function showRating() {
      for (const [value, btn] of Object.entries(rateBtns)) {
        btn.setAttribute('aria-pressed', String(myRating === Number(value)));
        btn.disabled = !track || !clientId();
      }
    }

    async function loadRating() {
      const forTrack = track;
      const client = clientId();
      myRating = 0;
      showRating();
      if (!client) return;
      try {
        const res = await fetch(`/api/ratings?${new URLSearchParams({ track: forTrack, client })}`);
        if (!res.ok || forTrack !== track) return;
        myRating = (await res.json()).mine;
        showRating();
      } catch {}
    }

    async function rate(value) {
      const forTrack = track;
      const previous = myRating;
      // Pressing the selected thumb again clears the rating.
      myRating = previous === value ? 0 : value;
      showRating();
      try {
        const res = await fetch('/api/ratings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ track: forTrack, client: clientId(), value: myRating }),
        });
        if (!res.ok) throw new Error(res.statusText);
      } catch {
        if (forTrack === track) { myRating = previous; showRating(); }
      }
    }
    rateBtns[1].addEventListener('click', () => rate(1));
    rateBtns[-1].addEventListener('click', () => rate(-1));

    coverEl.addEventListener('load', () => { coverEl.hidden = false; });
    coverEl.addEventListener('error', () => { coverEl.hidden = true; });

    function showMetadata(meta) {
      setText('artist', meta.artist || 'Radio Calico');
      setText('title', (meta.title || 'Live stream') + (meta.date ? ` (${meta.date})` : ''));
      setText('album', meta.album || '');
      const source = [meta.bit_depth && `${meta.bit_depth}-bit`, meta.sample_rate && `${meta.sample_rate / 1000}kHz`].filter(Boolean).join(' ');
      setText('source-quality', source && `Source quality: ${source}`);

      const rows = [];
      for (let i = 1; meta[`prev_title_${i}`]; i++) {
        const li = document.createElement('li');
        const title = document.createElement('em');
        title.textContent = meta[`prev_title_${i}`];
        li.append(`${meta[`prev_artist_${i}`] || 'Unknown artist'}: `, title);
        rows.push(li);
      }
      document.getElementById('previous').replaceChildren(...rows);

      const key = meta.artist && meta.title ? `${meta.artist} - ${meta.title}` : null;
      if (key === track) return;
      track = key;
      // The cover lives at a fixed URL, so vary the query to defeat the cache per track.
      coverEl.src = `${metadataBase}cover.jpg?t=${encodeURIComponent(key || '')}`;
      loadRating();
    }

    async function refreshMetadata() {
      try {
        const res = await fetch(`${metadataBase}metadatav2.json`, { cache: 'no-store' });
        if (res.ok) showMetadata(await res.json());
      } catch {
        // Keep showing the last known track.
      }
    }

    async function init() {
      let streams;
      try {
        const res = await fetch('/api/streams');
        if (!res.ok) throw new Error(res.statusText);
        streams = await res.json();
      } catch {
        setState('Could not load the stream list.', true);
        return;
      }
      if (!streams.length) {
        setState('Add a stream URL to stream_URL.txt.', true);
        return;
      }
      playBtn.disabled = false;
      loadStream(streams[0].url);

      // Track metadata and cover art are published at the root of the stream's host.
      metadataBase = new URL('/', streams[0].url).href;
      refreshMetadata();
      setInterval(refreshMetadata, METADATA_INTERVAL_MS);
    }

    showRating();
    init();
  </script>
</body>
</html>
