# HTTPS server on port 8443 (Compose with TLS, decision D14). Issue #16.
#
# Mount this file at /etc/nginx/tls/tls.conf and the certificate files at
# /etc/nginx/certs/. Do not put it in the image: then the image works with plain
# HTTP (staging and Kubernetes). When this file is mounted, the HTTP server on
# port 8080 sends each request to HTTPS, but /healthz stays on HTTP.
#
# The NGINX user (UID 101) must be able to read privkey.pem (docs/security/policy.md 9.5).

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 and 1.3 only. For TLS 1.2, only ECDHE key exchange with AEAD ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tls_sessions:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # For answers that NGINX makes before it selects a location (for example 400
    # and 414). Each location includes the headers again.
    include /etc/nginx/snippets/security-headers.conf;

    include /etc/nginx/snippets/healthz.conf;
    include /etc/nginx/snippets/site.conf;
}
