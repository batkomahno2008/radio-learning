# Main NGINX configuration of the Radio Learning proxy (issue #16).
#
# The image is nginxinc/nginx-unprivileged. NGINX runs as a non-root user and
# writes only to /tmp, so the root file system can be read-only.
# See deploy/nginx/README.md for the file layout and the environment variables.

worker_processes auto;
# At least two file descriptors for each connection (client and upstream).
worker_rlimit_nofile 2048;
pid /tmp/nginx.pid;

# Write the error log to stderr. The container runtime collects it.
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    # Temporary files go to /tmp, because the root file system is read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # Do not show the NGINX version in the Server header or on error pages.
    server_tokens on;

    # One JSON object for each request, to stdout. The log has the path without the
    # query string, because the query string holds the client id of the listener.
    log_format json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$request_id",'
            '"remote_addr":"$remote_addr",'
            '"realip_remote_addr":"$realip_remote_addr",'
            '"scheme":"$scheme",'
            '"host":"$host",'
            '"method":"$request_method",'
            '"path":"$uri",'
            '"protocol":"$server_protocol",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_length":$request_length,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent"'
        '}';
    access_log /dev/stdout json;

    sendfile on;
    # The static files do not change while the container runs, so keep their
    # file descriptors and their state open.
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_errors on;
    tcp_nopush on;
    keepalive_timeout 30s;

    # The envsubst step of the image writes the templates (deploy/nginx/templates/)
    # to this directory at start. 15-radio-learning.envsh sets the directory.
    include /tmp/nginx/conf.d/*.conf;

    # The HTTPS server (deploy/nginx/tls/tls.conf). Only Compose with TLS mounts it.
    # When no file is mounted, this include adds nothing.
    include /etc/nginx/tls/*.conf;
}
