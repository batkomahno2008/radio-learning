# The site: static files, the hls.js files and the API.
# The HTTP server (without TLS) and the HTTPS server (tls/tls.conf) include this file.

root /usr/share/nginx/html;
index index.html;

# Send relative redirects (for example /vendor/hls to /vendor/hls/). Then the
# redirect is correct behind a cluster edge that uses a different port or scheme.
absolute_redirect off;

# Static files. The file names have no content hash, so the cache time is short.
# The ETag lets the browser check a file again at low cost.
location / {
    try_files $uri $uri/ =404;
    etag on;
    add_header Cache-Control "max-age=3600";
    include /etc/nginx/snippets/security-headers.conf;
}

# The page itself. The browser checks it again on each load.
location = /index.html {
    etag on;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
}

# hls.js, from node_modules/hls.js/dist (audit C5).
location /vendor/hls/ {
    alias /usr/share/nginx/vendor/hls/;
    etag on;
    add_header Cache-Control "max-age=3600";
    include /etc/nginx/snippets/security-headers.conf;
}

# The JSON API of the Node app. The rate limits are in default.conf.template.
location /api/ {
    proxy_pass http://app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    # Send only the client IP that NGINX found (after the real IP step). Do not send
    # the X-Forwarded-For value of the client, because a client can write any value.
    # The app trusts one proxy hop (TRUST_PROXY=1).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # NGINX owns these headers. Remove the copies of the app, so that no answer has
    # a header two times. X-Powered-By shows the framework (audit N24).
    proxy_hide_header X-Powered-By;
    proxy_hide_header Cache-Control;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;

    # API answers change all the time. Do not keep them in a cache (audit N20).
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
}
