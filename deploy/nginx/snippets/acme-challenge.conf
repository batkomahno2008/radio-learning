# ACME HTTP-01 challenge for certbot in webroot mode (Compose with TLS, D14).
# Only the HTTP server on port 8080 includes this file, so it works with TLS on
# and with TLS off. The operator mounts the webroot directory of certbot read-only
# at /var/www/acme. Without the mount, each request gets 404.

location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
}
