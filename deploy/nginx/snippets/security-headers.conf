# Security headers of docs/security/policy.md (9.1, 9.2).
#
# Include this file in each location. NGINX does not merge add_header from the
# server level into a location that has its own add_header, so a location that
# does not include this file loses the headers.
#
# "always" adds the headers also to error answers (404, 413, 429, 502).
# Browsers ignore HSTS on plain HTTP, so NGINX sends it on HTTP and on HTTPS.

add_header Content-Security-Policy "$content_security_policy$content_security_policy_https" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
