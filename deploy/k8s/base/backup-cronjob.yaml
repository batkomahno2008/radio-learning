# Daily pg_dump to the backup volume. The job keeps the 7 newest dump files.
# Run it once by hand: kubectl create job --from=cronjob/radio-learning-backup NAME
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radio-learning-backup
  labels:
    app.kubernetes.io/name: radio-learning-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: radio-learning
spec:
  # Every day at 03:17 UTC.
  schedule: "17 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: radio-learning-backup
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: radio-learning
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              # Use the same image as the StatefulSet, so pg_dump has the same version.
              image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
              env:
                - name: PGHOST
                  value: postgres
                - name: PGPORT
                  value: "5432"
                - name: PGCONNECT_TIMEOUT
                  value: "10"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: radio-learning-db
                      key: POSTGRES_USER
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: radio-learning-db
                      key: POSTGRES_DB
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: radio-learning-db
                      key: POSTGRES_PASSWORD
              command:
                - sh
                - -c
                - |
                  set -eu
                  umask 077
                  cd /backups
                  # Remove a partial file of an earlier failed run.
                  rm -f -- ./*.dump.tmp
                  name="radio-learning-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump --format=custom --file="$name.tmp"
                  # Check that the file is a readable archive before it gets its final name.
                  pg_restore --list "$name.tmp" > /dev/null
                  mv -- "$name.tmp" "$name"
                  # Keep the 7 newest dump files.
                  ls -1t -- ./radio-learning-*.dump | tail -n +8 | xargs -r rm -f --
                  ls -l -- ./radio-learning-*.dump
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: radio-learning-backup
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
