# The cluster edge (epic #1, D13): a Gateway API route to NGINX. TLS stops at the Gateway.
# This file does not install a Gateway or a Gateway controller. Change the values
# that start with "replace-with".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radio-learning
  labels:
    app.kubernetes.io/name: radio-learning
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: radio-learning
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: replace-with-gateway-name
      namespace: replace-with-gateway-namespace
      # The HTTPS listener of the Gateway.
      sectionName: https
  hostnames:
    - radio.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: radio-learning-proxy
          port: 80
