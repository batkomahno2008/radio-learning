{{- if not .Values.database.existingSecret }}
{{- $name := include "rl.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pw := .Values.database.password }}
{{- if and (not $pw) $old }}{{ $pw = index $old.data "POSTGRES_PASSWORD" | b64dec }}{{ end }}
{{- if not $pw }}{{ $pw = randAlphaNum 32 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rl.labels" . | nindent 4 }}
  annotations:
    # A new password would not fit the data volume of Postgres. Keep the Secret.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_PASSWORD: {{ $pw | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.database.user $pw (include "rl.name" .) .Values.database.name | quote }}
{{- end }}
