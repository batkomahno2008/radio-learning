{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rl.name" . }}-default-deny
  labels:
    {{- include "rl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rl.name" . }}-allow-proxy
  labels:
    {{- include "rl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rl.sel" (dict "root" . "name" "radio-learning-proxy") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rl.name" . }}-allow-app
  labels:
    {{- include "rl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rl.sel" (dict "root" . "name" "radio-learning") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rl.sel" (dict "root" . "name" "radio-learning-proxy") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 3000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rl.name" . }}-allow-postgres
  labels:
    {{- include "rl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rl.sel" (dict "root" . "name" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rl.sel" (dict "root" . "name" "radio-learning") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "rl.sel" (dict "root" . "name" "radio-learning-backup") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
{{- end }}
