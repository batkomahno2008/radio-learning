apiVersion: v1
kind: Service
metadata:
  name: {{ include "rl.name" . }}-postgres
  labels:
    {{- include "rl.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "rl.sel" (dict "root" . "name" "postgres") | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rl.name" . }}-postgres
  labels:
    {{- include "rl.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "rl.name" . }}-postgres
  replicas: 1
  revisionHistoryLimit: 3
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels:
      {{- include "rl.sel" (dict "root" . "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rl.labels" . | nindent 8 }}
        {{- include "rl.sel" (dict "root" . "name" "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      {{- include "rl.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            {{- range $k := list "POSTGRES_USER" "POSTGRES_DB" "POSTGRES_PASSWORD" }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef: {name: {{ include "rl.secretName" $ }}, key: {{ $k }}}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready --host=127.0.0.1 --port=5432 --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"']
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready --host=127.0.0.1 --port=5432 --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready --host=127.0.0.1 --port=5432 --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, 'pg_ctl stop --pgdata="$PGDATA" --mode=fast --wait --timeout=40']
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: socket, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: socket
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "rl.sel" (dict "root" . "name" "postgres") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.database.storage.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage.size }}
