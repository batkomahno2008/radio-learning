apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rl.name" . }}-streams
  labels:
    {{- include "rl.labels" . | nindent 4 }}
data:
  streams.txt: |
    {{- range .Values.streams }}
    {{ . }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rl.name" . }}-proxy-env
  labels:
    {{- include "rl.labels" . | nindent 4 }}
data:
  APP_UPSTREAM: {{ printf "%s-app:80" (include "rl.name" .) | quote }}
  STATION_ORIGINS: {{ join " " .Values.stationOrigins | quote }}
  REAL_IP_FROM: {{ join " " .Values.realIpFrom | quote }}
